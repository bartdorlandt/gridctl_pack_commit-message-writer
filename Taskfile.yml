# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

vars:
  PACK: commit-message-writer
  # Override for local dev: task add REPO=file://$PWD AUTH=
  REPO: https://gitlab/nda/gridctl_stack/commit-message-writer.git
  # gridctl's built-in SSH can't negotiate with this GitLab, so clone over HTTPS with the vault token
  AUTH: --vault-key GITLAB_TOKEN

tasks:
  default: task -l --sort none

  add:
    desc: Import and apply the {{.PACK}} pack
    cmds:
      - task: check-vars
      - gridctl pack add {{.REPO}} {{.AUTH}}
      - gridctl pack apply {{.PACK}}

  remove:
    desc: Remove the {{.PACK}} pack
    cmds:
      - gridctl pack remove {{.PACK}}

  vars:
    desc: Print the 'gridctl var set' commands for this pack's declared variables
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        awk '/^variables:/{v=1;next} v&&/^[^ #]/{v=0}
          v&&/^  [A-Z0-9_]+:/{if(k)print k; k="gridctl var set " substr($1,1,length($1)-1)}
          v&&/secret: false/{k=k" --plaintext"}
          END{if(k)print k; else print "# no variables required"}' gridctl-pack.yaml

  check-vars:
    desc: Fail if a required variable of this pack is not set in gridctl
    dir: "{{.TASKFILE_DIR}}"
    silent: true
    cmds:
      - |
        missing=$(awk '/^variables:/{v=1;next} v&&/^[^ #]/{v=0}
          v&&/^  [A-Z0-9_]+:/{k=substr($1,1,length($1)-1)}
          v&&/required: true/{print k}' gridctl-pack.yaml |
          while read k; do gridctl var get "$k" >/dev/null 2>&1 || echo "$k"; done)
        if [ -n "$missing" ]; then
          echo "Missing required variables:" $missing
          echo "Run 'task vars' for the commands to set them."
          exit 1
        fi
